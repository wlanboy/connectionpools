spring.application.name=pool

spring.datasource.url=jdbc:mysql://localhost:3306/pool?connectionTimeZone=SERVER
spring.datasource.username=pool
spring.datasource.password=poolsecret

spring.sql.init.mode=always

# HikariCP, gleiche Werte wie hikari in pool-chart/values.yaml
spring.datasource.hikari.pool-name=pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
# Nach einem User- oder Passwortwechsel sind spätestens nach dieser Zeit
# alle Verbindungen mit den neuen Zugangsdaten aufgebaut (Default 30 min)
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=180000
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=0
