apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: {{ .Values.name }}-gateway
spec:
  selector:
    {{- toYaml .Values.istio.gatewaySelector | nindent 4 }}
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        {{- toYaml .Values.hosts | nindent 8 }}
