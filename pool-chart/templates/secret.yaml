# Das Passwort wird nach dem ersten Install von change-password.sh rotiert.
# lookup übernimmt den aktuellen Stand aus dem Cluster, damit ein späteres
# helm upgrade das Passwort nicht auf values.yaml zurücksetzt.
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-db" .Values.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-db
type: Opaque
{{- if $existing }}
data:
  {{- toYaml $existing.data | nindent 2 }}
{{- else }}
stringData:
  username: {{ .Values.database.username | quote }}
  password: {{ .Values.database.password | quote }}
  version: "initial"
{{- end }}
